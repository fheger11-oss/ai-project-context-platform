version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns:
          - "react"
          - "react-dom"
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
      tooling:
        patterns:
          - "eslint"
          - "prettier"
          - "typescript"
          - "turbo"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
