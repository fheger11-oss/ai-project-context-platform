  <text x="600" y="1062" text-anchor="middle" fill="#95A19C" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Timeline and Architecture History project change from repository activity and promoted contexts.</text>

  <text x="72" y="1147" fill="#75817C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.2">PROJECT CONTEXT  +  KNOWLEDGE  +  DECISIONS  +  HISTORY OVER TIME</text>
