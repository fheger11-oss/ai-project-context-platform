    </filter>
  </defs>

  <image width="1200" height="1200" xlink:href="ctxaro-v3-campaign-02-background.png" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="1200" fill="url(#veil)"/>

  <g transform="translate(72 62)">
