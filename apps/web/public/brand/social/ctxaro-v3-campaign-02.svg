    <text x="100" y="518" fill="#AAB5B0" font-size="16">Active · superseded · archived</text>
    <text x="100" y="547" fill="#75817C" font-size="14">Repository-scoped and persisted</text>

    <rect x="796" y="366" width="332" height="210" rx="14" fill="#07100D" fill-opacity="0.96" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="824" y="407" fill="#45D39A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.7">STORED RECORD</text>
