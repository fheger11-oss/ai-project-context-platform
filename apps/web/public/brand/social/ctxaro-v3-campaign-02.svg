      <stop stop-color="#050706" stop-opacity="0.28"/>
      <stop offset="0.56" stop-color="#050706" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#050706" stop-opacity="0.92"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
