    <text x="100" y="751" fill="#45D39A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.7">CHRONOLOGICAL PROJECTION</text>
    <text x="100" y="795" fill="#F7FAF8" font-size="25" font-weight="620">Timeline</text>
    <text x="100" y="833" fill="#AAB5B0" font-size="16">Repository connected</text>
    <text x="100" y="861" fill="#AAB5B0" font-size="16">Updates · context promoted</text>
    <text x="100" y="889" fill="#AAB5B0" font-size="16">Decision effective</text>

    <rect x="796" y="710" width="332" height="224" rx="14" fill="#07100D" fill-opacity="0.96" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="824" y="751" fill="#45D39A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.7">DERIVED COMPARISON</text>
