<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Ctxaro V2 — Continuous Project Context</title>
  <desc>V1 created Project Context from a repository analysis. V2 maintains a verified current Project Context as the connected repository changes, while preserving previous context versions.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#fff" stroke-opacity=".032"/></pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(930 720) rotate(140) scale(560)"><stop stop-color="#45D39A" stop-opacity=".16"/><stop offset="1" stop-color="#45D39A" stop-opacity="0"/></radialGradient>
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45D39A" stop-opacity=".15"/><stop offset=".5" stop-color="#45D39A"/><stop offset="1" stop-color="#45D39A" stop-opacity=".15"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="#050706"/><rect width="1200" height="1200" fill="url(#grid)"/><rect width="1200" height="1200" fill="url(#glow)"/>
  <circle cx="1000" cy="770" r="190" stroke="#45D39A" stroke-opacity=".08"/><circle cx="1000" cy="770" r="280" stroke="#45D39A" stroke-opacity=".045"/>

  <g transform="translate(72 64)">
    <rect width="48" height="48" rx="8" fill="#45D39A" fill-opacity=".09" stroke="#45D39A" stroke-opacity=".26"/>
    <g transform="translate(8 8)" color="#45D39A"><path d="M16 4.5 25.5 10v12L16 27.5 6.5 22V10L16 4.5Z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 10.5 21 13.35v5.3l-5 2.85-5-2.85v-5.3l5-2.85Z" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 10 11 13.35M25.5 10 21 13.35M16 21.5v6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="16" cy="4.5" r="1.7" fill="currentColor"/><circle cx="6.5" cy="22" r="1.7" fill="currentColor"/><circle cx="25.5" cy="22" r="1.7" fill="currentColor"/></g>
    <text x="64" y="32" fill="#F7FAF8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">Ctxaro V2</text>
  </g>
  <text x="72" y="190" fill="#45D39A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" letter-spacing="3">BUILDING CTXARO V2</text>
  <text x="72" y="258" fill="#F7FAF8" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="650" letter-spacing="-2.2">Continuous Project Context</text>
  <text x="72" y="305" fill="#9EAAA5" font-family="Inter,Arial,sans-serif" font-size="22">From a one-time repository analysis to context maintained as the project changes.</text>

  <g transform="translate(72 382)">
    <rect width="440" height="648" rx="18" fill="#08100E" fill-opacity=".9" stroke="#fff" stroke-opacity=".10"/>
    <text x="30" y="48" fill="#7E8984" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="600" letter-spacing="2">V1 · ONE-TIME CONTEXT</text>
    <text x="30" y="86" fill="#EAF0ED" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">Analyze a repository</text>
    <g transform="translate(30 132)" font-family="Inter,Arial,sans-serif">
      <rect width="380" height="86" rx="10" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".10"/>
      <path d="M28 31h24l7 7h29v26H28z" stroke="#9EAAA5" stroke-width="2" stroke-linejoin="round"/><text x="108" y="53" fill="#DCE4E0" font-size="18" font-weight="550">GitHub Repository</text>
      <path d="M190 218v42" stroke="#68736E" stroke-width="2"/><path d="m182 252 8 8 8-8" stroke="#68736E" stroke-width="2"/>
      <rect y="260" width="380" height="86" rx="10" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".10"/>
      <circle cx="51" cy="303" r="17" stroke="#9EAAA5" stroke-width="2"/><path d="m43 303 6 6 11-13" stroke="#9EAAA5" stroke-width="2"/><text x="108" y="310" fill="#DCE4E0" font-size="18" font-weight="550">Scan + Analysis</text>
      <path d="M190 346v42" stroke="#68736E" stroke-width="2"/><path d="m182 380 8 8 8-8" stroke="#68736E" stroke-width="2"/>
      <rect y="388" width="380" height="112" rx="10" fill="#45D39A" fill-opacity=".045" stroke="#45D39A" stroke-opacity=".22"/>
      <rect x="28" y="420" width="44" height="48" rx="6" stroke="#45D39A" stroke-width="2"/><path d="M40 434h20M40 444h20M40 454h13" stroke="#45D39A" stroke-width="2"/>
      <text x="108" y="439" fill="#F4F8F6" font-size="19" font-weight="600">Project Context</text><text x="108" y="466" fill="#92A09A" font-size="14">for the analyzed commit</text>
    </g>
  </g>

  <g transform="translate(548 382)">
    <rect width="580" height="648" rx="18" fill="#07100D" fill-opacity=".94" stroke="#45D39A" stroke-opacity=".25"/>
    <rect x="1" y="1" width="578" height="646" rx="17" stroke="url(#greenLine)" stroke-opacity=".45"/>
    <text x="30" y="48" fill="#45D39A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="600" letter-spacing="2">V2 · CONTINUOUS CONTEXT</text>
    <text x="30" y="86" fill="#F4F8F6" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">Maintain context as code changes</text>
    <g transform="translate(30 126)" font-family="Inter,Arial,sans-serif">
      <rect width="520" height="88" rx="10" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".10"/>
      <path d="M28 31h24l7 7h29v26H28z" stroke="#9EAAA5" stroke-width="2" stroke-linejoin="round"/><circle cx="82" cy="31" r="7" fill="#45D39A"/><text x="110" y="43" fill="#E3E9E6" font-size="18" font-weight="600">Connected repository changes</text><text x="110" y="66" fill="#84908A" font-size="13">default-branch pushes can trigger an update</text>
      <path d="M260 88v37" stroke="#45D39A" stroke-opacity=".55" stroke-width="2"/><path d="m252 117 8 8 8-8" stroke="#45D39A" stroke-opacity=".7" stroke-width="2"/>
      <rect y="125" width="520" height="118" rx="10" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".10"/>
      <g transform="translate(0 125)">
        <g transform="translate(24 24)"><rect width="142" height="70" rx="8" fill="#050706" stroke="#fff" stroke-opacity=".09"/><text x="18" y="30" fill="#8E9A94" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1">CHANGESET</text><text x="18" y="53" fill="#D7DFDB" font-size="14">Compare states</text></g>
        <path d="M176 60h38" stroke="#59645F" stroke-width="2"/><path d="m206 52 8 8-8 8" stroke="#59645F" stroke-width="2"/>
        <g transform="translate(224 24)"><rect width="272" height="70" rx="8" fill="#45D39A" fill-opacity=".04" stroke="#45D39A" stroke-opacity=".18"/><text x="18" y="30" fill="#45D39A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1">UPDATE PROCESSING</text><text x="18" y="53" fill="#E4EBE8" font-size="14">Scan · Analysis · Context</text></g>
      </g>
      <path d="M260 243v37" stroke="#45D39A" stroke-opacity=".55" stroke-width="2"/><path d="m252 272 8 8 8-8" stroke="#45D39A" stroke-opacity=".7" stroke-width="2"/>
      <g transform="translate(0 280)">
        <rect width="520" height="144" rx="10" fill="#45D39A" fill-opacity=".06" stroke="#45D39A" stroke-opacity=".3"/>
        <rect x="24" y="28" width="48" height="52" rx="7" stroke="#45D39A" stroke-width="2"/><path d="M37 43h22M37 54h22M37 65h15" stroke="#45D39A" stroke-width="2"/>
        <text x="94" y="50" fill="#F7FAF8" font-size="21" font-weight="650">Current Project Context</text><text x="94" y="78" fill="#9BA7A1" font-size="14">promoted after provenance validation</text>
        <rect x="24" y="100" width="92" height="24" rx="12" fill="#45D39A" fill-opacity=".12" stroke="#45D39A" stroke-opacity=".28"/><circle cx="40" cy="112" r="4" fill="#45D39A"/><text x="51" y="117" fill="#77E4B6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700">FRESH</text>
        <text x="132" y="117" fill="#718079" font-size="13">verified remote HEAD = context commit</text>
      </g>
      <path d="M260 424v30" stroke="#65716B" stroke-width="2"/><path d="m252 446 8 8 8-8" stroke="#65716B" stroke-width="2"/>
      <g transform="translate(0 454)">
        <rect width="520" height="64" rx="10" fill="#fff" fill-opacity=".018" stroke="#fff" stroke-opacity=".08"/>
        <g transform="translate(20 17)"><rect x="0" y="8" width="34" height="22" rx="4" fill="#101714" stroke="#66716C"/><rect x="10" y="4" width="34" height="22" rx="4" fill="#0D1512" stroke="#738079"/><rect x="20" width="34" height="22" rx="4" fill="#0B1712" stroke="#45D39A" stroke-opacity=".55"/></g><text x="94" y="39" fill="#AAB5B0" font-size="14">Previous Project Context versions remain available</text>
      </g>
    </g>
  </g>
  <text x="72" y="1100" fill="#718079" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="1.4">VERIFIED REPOSITORY ANALYSIS · VERSIONED PROJECT CONTEXT</text>
</svg>
