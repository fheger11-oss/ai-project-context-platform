<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Ctxaro V2 — How Continuous Project Context works</title>
  <desc>A GitHub default-branch push is accepted by a durable webhook dispatch, processed as a repository update, scanned and analyzed, then validated before the new Project Context becomes current.</desc>
  <defs>
    <pattern id="grid2" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#fff" stroke-opacity=".03"/></pattern>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1020 795) rotate(180) scale(470)"><stop stop-color="#45D39A" stop-opacity=".18"/><stop offset="1" stop-color="#45D39A" stop-opacity="0"/></radialGradient>
    <linearGradient id="rail" x1="90" y1="0" x2="1110" y2="0"><stop stop-color="#45D39A" stop-opacity=".16"/><stop offset=".45" stop-color="#45D39A" stop-opacity=".75"/><stop offset="1" stop-color="#45D39A"/></linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="#050706"/><rect width="1200" height="1200" fill="url(#grid2)"/><rect width="1200" height="1200" fill="url(#glow2)"/>
  <g transform="translate(72 64)"><rect width="48" height="48" rx="8" fill="#45D39A" fill-opacity=".09" stroke="#45D39A" stroke-opacity=".26"/><g transform="translate(8 8)" color="#45D39A"><path d="M16 4.5 25.5 10v12L16 27.5 6.5 22V10L16 4.5Z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 10.5 21 13.35v5.3l-5 2.85-5-2.85v-5.3l5-2.85Z" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 10 11 13.35M25.5 10 21 13.35M16 21.5v6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="16" cy="4.5" r="1.7" fill="currentColor"/><circle cx="6.5" cy="22" r="1.7" fill="currentColor"/><circle cx="25.5" cy="22" r="1.7" fill="currentColor"/></g><text x="64" y="32" fill="#F7FAF8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">Ctxaro V2</text></g>
  <text x="72" y="190" fill="#45D39A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" letter-spacing="3">CONTINUOUS PROJECT CONTEXT</text>
  <text x="72" y="258" fill="#F7FAF8" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="650" letter-spacing="-2">From repository change</text><text x="72" y="321" fill="#F7FAF8" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="650" letter-spacing="-2">to verified current context.</text>
  <text x="72" y="372" fill="#9EAAA5" font-family="Inter,Arial,sans-serif" font-size="21">Default-branch pushes can trigger durable update processing—without replacing the current context early.</text>

  <g transform="translate(72 455)" font-family="Inter,Arial,sans-serif">
    <path d="M78 292H978" stroke="#14211C" stroke-width="10" stroke-linecap="round"/><path d="M78 292H978" stroke="url(#rail)" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(0 190)"><rect width="196" height="204" rx="16" fill="#08100E" stroke="#fff" stroke-opacity=".11"/><circle cx="98" cy="102" r="29" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".12"/><path d="M78 94h16l7 7h19v18H78z" stroke="#A6B1AC" stroke-width="2"/><circle cx="113" cy="94" r="5" fill="#45D39A"/><text x="98" y="154" text-anchor="middle" fill="#E8EEEB" font-size="17" font-weight="600">GitHub Push</text><text x="98" y="177" text-anchor="middle" fill="#76837D" font-size="12">default branch</text></g>
    <g transform="translate(226 190)"><rect width="196" height="204" rx="16" fill="#08100E" stroke="#fff" stroke-opacity=".11"/><circle cx="98" cy="102" r="29" fill="#45D39A" fill-opacity=".05" stroke="#45D39A" stroke-opacity=".2"/><path d="M83 87v29M113 87v29M83 94h30M83 109h30" stroke="#45D39A" stroke-width="2"/><text x="98" y="154" text-anchor="middle" fill="#E8EEEB" font-size="17" font-weight="600">Webhook Dispatch</text><text x="98" y="177" text-anchor="middle" fill="#76837D" font-size="12">stored · leased · retried</text></g>
    <g transform="translate(452 154)"><rect width="260" height="276" rx="18" fill="#07110D" stroke="#45D39A" stroke-opacity=".26"/><text x="22" y="38" fill="#45D39A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" letter-spacing="1.5">REPOSITORY UPDATE</text><rect x="22" y="58" width="216" height="54" rx="8" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".09"/><text x="42" y="90" fill="#DCE4E0" font-size="15" font-weight="550">ChangeSet comparison</text><path d="M130 112v20" stroke="#66736D"/><rect x="22" y="132" width="216" height="54" rx="8" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".09"/><text x="42" y="164" fill="#DCE4E0" font-size="15" font-weight="550">Target commit scan</text><path d="M130 186v20" stroke="#66736D"/><rect x="22" y="206" width="216" height="48" rx="8" fill="#45D39A" fill-opacity=".045" stroke="#45D39A" stroke-opacity=".16"/><text x="42" y="235" fill="#EAF1ED" font-size="15" font-weight="550">Analysis + Context</text></g>
    <g transform="translate(742 190)"><rect width="196" height="204" rx="16" fill="#08100E" stroke="#fff" stroke-opacity=".11"/><circle cx="98" cy="102" r="29" fill="#45D39A" fill-opacity=".05" stroke="#45D39A" stroke-opacity=".2"/><path d="m84 102 9 9 19-22" stroke="#45D39A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="154" text-anchor="middle" fill="#E8EEEB" font-size="17" font-weight="600">Validate provenance</text><text x="98" y="177" text-anchor="middle" fill="#76837D" font-size="12">repository · commit · artifacts</text></g>
    <g transform="translate(968 172)"><rect width="160" height="240" rx="18" fill="#45D39A" fill-opacity=".075" stroke="#45D39A" stroke-opacity=".38"/><circle cx="80" cy="96" r="33" fill="#45D39A" fill-opacity=".11" stroke="#45D39A" stroke-opacity=".3"/><rect x="66" y="77" width="28" height="35" rx="4" stroke="#68DFAD" stroke-width="2"/><path d="M73 87h14M73 95h14M73 103h9" stroke="#68DFAD" stroke-width="2"/><text x="80" y="153" text-anchor="middle" fill="#F7FAF8" font-size="17" font-weight="650">Current</text><text x="80" y="176" text-anchor="middle" fill="#F7FAF8" font-size="17" font-weight="650">Project Context</text><rect x="45" y="194" width="70" height="24" rx="12" fill="#45D39A" fill-opacity=".14" stroke="#45D39A" stroke-opacity=".28"/><circle cx="60" cy="206" r="4" fill="#45D39A"/><text x="70" y="211" fill="#77E4B6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700">FRESH</text></g>

    <text x="0" y="45" fill="#718079" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1.5">WHEN AUTOMATIC UPDATES ARE ENABLED</text>
    <g transform="translate(0 484)"><rect width="1128" height="116" rx="14" fill="#07100D" fill-opacity=".78" stroke="#fff" stroke-opacity=".08"/><g transform="translate(24 28)"><rect x="0" y="14" width="42" height="28" rx="5" fill="#0B1210" stroke="#56625C"/><rect x="12" y="7" width="42" height="28" rx="5" fill="#0B1411" stroke="#68756F"/><rect x="24" width="42" height="28" rx="5" fill="#0C1712" stroke="#45D39A" stroke-opacity=".55"/></g><text x="112" y="49" fill="#DCE4E0" font-size="17" font-weight="600">Safe promotion preserves the previous current context</text><text x="112" y="77" fill="#7F8C86" font-size="14">A newly generated context becomes current only after its repository and commit provenance are validated.</text><text x="1000" y="63" text-anchor="end" fill="#45D39A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1">HISTORY PRESERVED</text></g>
  </g>
  <text x="72" y="1130" fill="#718079" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="1.3">FULL TARGET SNAPSHOT · SOURCE-STRUCTURE REUSE WHEN ELIGIBLE · FULL-PATH FALLBACK</text>
</svg>
