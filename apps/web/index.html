                "@type": "Question",
                "name": "What is Ctxaro?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Ctxaro is a repository understanding and Project Memory application for developers. It builds structured Project Context from a connected repository and preserves supported knowledge, decisions, timeline events, and architecture history as the project evolves."
                }
              },
              {
                "@type": "Question",
                "name": "What is Project Context?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Project Context is Ctxaro's structured representation of a repository's current technical state at a specific commit, with evidence and confidence for its supported claims."
                }
              },
              {
                "@type": "Question",
                "name": "What is Project Memory?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Project Memory is the persistent layer around the current Project Context. It brings together durable project knowledge, decisions, timeline events, and architecture history."
                }
              },
              {
                "@type": "Question",
                "name": "How is Project Memory different from Project Context?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Project Context describes the repository's technical state at a specific commit. Project Memory preserves supported records and history that remain useful beyond that current snapshot."
                }
              },
              {
                "@type": "Question",
                "name": "Is Ctxaro an AI coding agent?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Ctxaro is a repository understanding and Project Memory application, not a chatbot or coding agent, and it does not modify repository source code."
                }
